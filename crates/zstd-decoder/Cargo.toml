[package]
name = "ctopo-zstd-decoder"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm-bindgen wrapper exposing zstd decompress + prepared dict for .ctopo readers"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
zstd = { version = "0.13", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-pack's bundled wasm-opt rejects bulk-memory ops without an
# explicit feature flag. We disable wasm-pack's wasm-opt step and
# run our own pass with --enable-bulk-memory in scripts/build-wasm.mjs.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
